name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy (engine strict, bridge, cli)
        run: mypy meddler/engine meddler/bridge meddler/cli.py
      - name: Import layering
        run: lint-imports
      - name: JavaScript syntax
        run: |
          for f in web/*.js; do
            node --check "$f"
          done

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest (everything except the slow multi-seed runs)
        run: pytest -q -n auto -m "not slow"

  slow:
    # The multi-seed catalog-coverage and cascade runs take many minutes each, so they run
    # once, on one Python version, instead of in every matrix cell.
    name: Slow tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest (slow only)
        run: pytest -q -n auto -m slow

  golden:
    name: Golden master & packaged install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # A regular (non-editable) install from a built wheel, run from outside the checkout,
      # so this exercises exactly what a user gets from `pip install .`.
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
      - name: Headless log is byte-identical to the golden master
        working-directory: ${{ runner.temp }}
        run: |
          golden="$GITHUB_WORKSPACE/tests/golden/seed1337_1000t.txt"
          # Different hash seeds per run: set/dict iteration order must never leak into
          # the event stream.
          PYTHONHASHSEED=1 venv/bin/meddler run --headless --seed 1337 --ticks 1000 > run1.txt
          PYTHONHASHSEED=2 venv/bin/meddler run --headless --seed 1337 --ticks 1000 > run2.txt
          cmp run1.txt "$golden"
          cmp run2.txt "$golden"
      - name: Installed server serves the UI and the engine socket
        working-directory: ${{ runner.temp }}
        run: |
          venv/bin/meddler serve --port 7677 > serve.log 2>&1 &
          server_pid=$!
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:7677/ && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:7677/ | grep -qi "<title>"
          curl -fsS -o /dev/null http://127.0.0.1:7677/app.js
          curl -fsS -o /dev/null http://127.0.0.1:7677/style.css
          venv/bin/python - <<'EOF'
          import asyncio, json
          from websockets.asyncio.client import connect

          async def main():
              async with connect("ws://127.0.0.1:7677/ws") as ws:
                  hello = json.loads(await asyncio.wait_for(ws.recv(), 10))
                  assert hello["type"] == "hello", hello
                  print("hello received, seed", hello.get("seed"))

          asyncio.run(main())
          EOF
          kill "$server_pid"
      - name: Server log
        if: always()
        working-directory: ${{ runner.temp }}
        run: cat serve.log || true
